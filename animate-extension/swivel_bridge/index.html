<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Send to Swivel</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div id="panel">
        <div id="statusRow">
            <div id="statusText">
                <div id="header">
                    <span id="dot" class="dot off"></span>
                    <div id="doc">No document open</div>
                </div>
                <span id="state">Checking for Swivel&hellip;</span>
            </div>
        </div>

        <div id="convertRow">
            <div id="hint"><span>Create SWF first </span> (Ctrl+Enter)</div>

            <div id="convertActions">
                <button id="launch" class="secondary icon" title="Open Swivel App">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h6"/>
                        <path d="m21 3-9 9"/>
                        <path d="M15 3h6v6"/>
                    </svg>
                </button>

                <button id="convert" title="Convert to MP4 in one click">Render in Swivel</button>
            </div>
        </div>

        <div id="actions">
            <button id="send" class="secondary" title="Add SWF to Swivel input list">Add to Swivel input</button>

            <button id="grab" class="secondary icon" title="Save current frame as PNG (stage size)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 7V5a2 2 0 0 1 2-2h2"/>
                    <path d="M17 3h2a2 2 0 0 1 2 2v2"/>
                    <path d="M21 17v2a2 2 0 0 1-2 2h-2"/>
                    <path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
                    <rect width="10" height="8" x="7" y="8" rx="1"/>
                </svg>
            </button>

            <button id="copyClip" class="secondary icon" title="Copy current frame to clipboard (stage size)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="8" height="4" x="8" y="2" rx="1"/>
                    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
                </svg>
            </button>
        </div>
        <div id="progressWrap" style="display:none">
            <div id="progressBar"><div id="progressFill"></div></div>
            <span id="progressLabel">Idle</span>
        </div>



    </div>

    <script src="./js/CSInterface.js"></script>
    <script src="./js/panel.js"></script>
</body>
</html>
